<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121715">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>LDI · Let’s Do It</title>
<style>
:root {
  color-scheme: dark;
  font-family: system-ui, sans-serif;
  background: #121715;
  color: #eef3ee;
  --panel: #1d2420;
  --line: #354239;
  --accent: #d8f68c;
  --muted: #acbdb0;
}
* { box-sizing: border-box; }
body { margin: 0; }
header, main { max-width: 620px; margin: auto; }
header {
  padding: calc(env(safe-area-inset-top) + 3px) max(14px, env(safe-area-inset-right)) 3px max(14px, env(safe-area-inset-left));
  color: var(--muted);
  font-size: .75rem;
}
header strong { color: var(--accent); margin-right: 5px; }
main {
  padding: 2px max(14px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
h1 { font-size: 1.4rem; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
h2 { margin: 0 0 6px; overflow-wrap: anywhere; }
p { margin: 8px 0; overflow-wrap: anywhere; }
button, .button {
  display: inline-grid;
  place-items: center;
  min-height: 44px;
  border: 0;
  border-radius: 8px;
  padding: 6px 12px;
  background: #2a352e;
  color: inherit;
  font: 650 .875rem system-ui, sans-serif;
  cursor: pointer;
}
button.primary { background: var(--accent); color: #182315; }
button.danger { background: #3b2828; color: #ffbcb5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.topline, .group-row, .row, .chips { display: flex; align-items: center; gap: 6px; }
.topline { justify-content: space-between; min-height: 44px; }
.group-heading { justify-content: flex-start; }
.back { width: 44px; background: transparent; color: var(--accent); font-size: 1.6rem; padding: 0; }
.group-row { border-bottom: 1px solid var(--line); }
.group-row button { background: transparent; }
.group-row .group-name {
  flex: 1;
  min-width: 0;
  justify-items: start;
  text-align: left;
  overflow-wrap: anywhere;
  padding-left: 4px;
  font-size: 1rem;
}
.group-row button:last-child { color: var(--muted); }
nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 2px 0 8px; }
nav button { border-radius: 0; background: transparent; border-bottom: 2px solid var(--line); padding-inline: 2px; }
nav button[aria-current] { color: var(--accent); border-color: var(--accent); }
.tools-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
.row, .chips { flex-wrap: wrap; }
article, form { background: var(--panel); border-radius: 8px; padding: 10px; margin: 6px 0; }
#filters, footer details, .activity { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; min-height: 44px; padding: 10px 4px; font-weight: 650; overflow-wrap: anywhere; }
.activity-content { padding: 0 4px 8px; }
footer { margin-top: 8px; }
footer details > .row { padding-bottom: 6px; }
footer summary, .muted { color: var(--muted); font-size: .875rem; }
label.field { display: block; margin-bottom: 8px; font-size: .875rem; font-weight: 650; }
input:not([type=checkbox]), textarea {
  display: block; width: 100%; margin-top: 3px; padding: 7px;
  background: #151b17; color: inherit; border: 1px solid #536258; border-radius: 6px;
  font: 1rem system-ui, sans-serif;
}
fieldset { border: 0; padding: 0; margin: 8px 0; }
legend { font-weight: 700; font-size: .875rem; margin-bottom: 3px; }
.chip, .tag { background: #2a352e; border-radius: 6px; padding: 3px 6px; font-size: .875rem; }
.chip { min-height: 44px; display: flex; align-items: center; gap: 3px; }
.chip:has(:checked) { background: var(--accent); color: #182315; }
input[type=checkbox] { accent-color: var(--accent); }
.tags { margin: 6px 0; }
.description { white-space: pre-wrap; }
.result { background: #263520; }
.wide { width: 100%; }
#notice:empty, #filter-count:empty { display: none; }
#notice { background: #263520; padding: 6px; border-radius: 6px; }
#filter-count { margin-left: 4px; color: var(--accent); font-size: .8rem; }
.filter-table { width: 100%; border-collapse: collapse; font-size: .875rem; margin-bottom: 4px; }
.filter-table th { text-align: left; padding-inline: 4px; }
.filter-table th:not(:first-child) { text-align: center; }
.filter-table th[scope=row] { font-weight: 500; }
.filter-table .filter-category { color: var(--muted); padding-top: 6px; border-top: 1px solid var(--line); }
.filter-table td { padding: 0; width: 64px; }
.filter-table label { display: grid; place-items: center; min-height: 32px; cursor: pointer; }
.filter-table input { width: 17px; height: 17px; margin: 0; }
#filters > button { margin-bottom: 6px; }
</style>
<body>
<header><div><strong>LDI</strong> Let’s Do It</div></header>
<main><div id="notice" role="status"></div><div id="app"></div></main>
<script src="./app.js" defer></script>
</body>
</html>
